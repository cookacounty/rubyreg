    <circle cx="222" cy="102" r="8"/>
    <circle cx="230" cy="166" r="8"/>
    <circle cx="91" cy="113" r="8"/>
  </g>

  <g>
    <text x="340" y="138" fill="url(#word)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="0">Ruby Reg</text>
    <text x="344" y="190" fill="#5c6b80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="1.5">XLSX TO VERILOG REGISTER MAPS</text>
