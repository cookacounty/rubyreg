<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ruby Reg logo</title>
  <desc id="desc">A ruby gem shaped circuit mark beside the Ruby Reg wordmark.</desc>
  <defs>
    <linearGradient id="ruby" x1="110" y1="44" x2="236" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a6a"/>
      <stop offset="0.48" stop-color="#c81e4f"/>
      <stop offset="1" stop-color="#741536"/>
    </linearGradient>
    <linearGradient id="trace" x1="66" y1="212" x2="278" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2de2c6"/>
      <stop offset="1" stop-color="#79f2ff"/>
    </linearGradient>
    <linearGradient id="word" x1="344" y1="82" x2="752" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#192334"/>
      <stop offset="1" stop-color="#48576c"/>
    </linearGradient>
    <filter id="shadow" x="38" y="30" width="272" height="246" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#111827" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="960" height="300" rx="24" fill="#fbfcff"/>

  <g filter="url(#shadow)">
