    <path d="M173 38L207 92H262L173 38Z" fill="#ff8a8f" fill-opacity="0.78"/>
    <path d="M50 92H139L173 38L50 92Z" fill="#ff6b77" fill-opacity="0.85"/>
    <path d="M72 213L139 92H50L72 213Z" fill="#b51d45" fill-opacity="0.88"/>
    <path d="M241 213L207 92H262L241 213Z" fill="#8f173b" fill-opacity="0.82"/>
    <path d="M72 213H241L173 262L72 213Z" fill="#6f1532" fill-opacity="0.86"/>
    <path d="M139 92H207L241 213H72L139 92Z" fill="#d72a58"/>
    <path d="M139 92L173 38L207 92H139Z" fill="#ff3f63"/>
    <path d="M139 92L173 262L207 92H139Z" fill="#a91642" fill-opacity="0.42"/>
  </g>

  <g stroke="url(#trace)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
